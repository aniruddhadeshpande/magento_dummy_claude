<!--
    SKU lookup step of the shipping plan wizard.
    Bound viewModel: Study_InventoryFulfillment/js/sku-loopup
    Key bindings: textInput: sku, submit: handleSubmit, html: messageResponse, style color driven by isSuccess()
-->
<div class="sku-lookup">
    <h2 data-bind="i18n: 'SKU Lookup'"></h2>
    <form data-bind="submit: handleSubmit">
        <input id="text"
            type="text"
            name="sku"
            data-bind="textInput: sku, attr: {placeholder: placeholder}" />
        <button class="action primary" type="submit"><!-- ko i18n: 'Confirm SKU'--> <!-- /ko--></button>
        <div class="message-response" data-bind="html: messageResponse, style: {color: isSuccess() ? 'green': 'red' }"></div>
    </form>
</div>
