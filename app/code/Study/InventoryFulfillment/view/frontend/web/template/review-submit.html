<!--
    Review and submit step of the shipping plan wizard; shown only after box configurations are confirmed.
    Bound viewModel: Study_InventoryFulfillment/js/review-submit
    Key bindings: visible: billingModelValidationSuccess, text: numberOfBoxes / shipmentWeight / billableWeight,
                  checked: isTermsChecked, enable: canSubmit(), submit: handleSubmit,
                  value: ko.toJSON(boxConfigurations) (hidden), value: sku() (hidden)
-->
<div class="review-submit" data-bind="visible: billingModelValidationSuccess ">
    <h2 data-bind="i18n: 'Review & Submit'"></h2>
    <p><!-- ko i18n: 'Please review the box configurations before submitting.' --> <!-- /ko --></p>
    <form data-bind="submit: handleSubmit"> <!--  attr: {action: getUrl(), method: 'post' } for NON AJAX call -->
        <table>
            <thead>
                <tr>
                    <th data-bind="i18n: 'Number of boxes'"></th>
                    <th data-bind="i18n: 'Shipment weight'"></th>
                    <th data-bind="i18n: 'Billable weight'"></th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>
                        <span data-bind="text: numberOfBoxes"></span>
                    </td>
                    <td>
                        <span data-bind="text: shipmentWeight"></span>
                        <!-- ko i18n: 'lb.' --><!-- /ko -->
                    </td>
                    <td>
                        <span data-bind="text: billableWeight"></span>
                        <!-- ko i18n: 'lb.' --><!-- /ko -->
                    </td>
                </tr>
                <tr>
                    <td colspan="2">
                        <input type="checkbox" data-bind="checked: isTermsChecked"/>
                        <!-- ko i18n: 'I agree to the Terms & Conditions.'--><!-- /ko -->
                    </td>
                    <td>
                        <button class="action primary" type="submit" data-bind="enable: canSubmit()">
                            <!-- ko i18n: 'Accept shipping plan' --><!-- /ko -->
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </form>
    <input type="hidden" data-bind="value: ko.toJSON(boxConfigurations)" name="boxConfigurations" />
    <input type="hidden" data-bind="value: sku()" name="sku">
</div>
